[package]
name = "relief"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Finds developer build output and caches that are no longer used, and deletes them on a schedule"
license = "MIT"
repository = "https://github.com/tatlilimon/relief"
readme = "README.md"
keywords = ["cleanup", "disk-space", "cache", "node_modules", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.9", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2.191"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
